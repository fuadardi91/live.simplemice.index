<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simplemice Live Event - Upload Foto</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600;1,800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        heading: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-5 md:p-6 shadow-2xl relative my-auto space-y-4">
        
        <!-- Header Branding -->
        <div class="text-center pb-3 border-b border-slate-800">
            <div class="inline-flex items-center gap-2 bg-rose-500/10 text-rose-400 border border-rose-500/20 px-3 py-1 rounded-full font-bold text-xs uppercase tracking-wider mb-2">
                <i class="fa-solid fa-camera-retro"></i> Simplemice Guest App
            </div>
            <h1 id="eventTitleHeading" class="text-xl md:text-2xl font-extrabold font-heading text-white">Gala Dinner</h1>
            <p id="eventSubtitleHeading" class="text-xs text-cyan-400 font-semibold uppercase tracking-widest mt-0.5">BNI Enterprise</p>
            <p class="text-[11px] text-slate-400 mt-2">Unggah foto momen serumu untuk langsung ditayangkan di layar Videotron!</p>
        </div>

        <form id="uploadForm" onsubmit="event.preventDefault(); submitPhotoFromMobile();" class="space-y-4 text-xs">
            
            <!-- Sender Name -->
            <div>
                <label for="guestNameInput" class="block font-semibold text-slate-300 mb-1">Nama / Inisial Pengirim <span class="text-rose-400">*</span></label>
                <input type="text" id="guestNameInput" required placeholder="Contoh: Budi & Sarah" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-cyan-500 text-sm">
            </div>

            <!-- Image Picker Box -->
            <div>
                <label class="block font-semibold text-slate-300 mb-1">Pilih / Ambil Foto <span class="text-rose-400">*</span></label>
                <div id="photoDropZone" onclick="document.getElementById('mobileFileInput').click()" class="border-2 border-dashed border-slate-700 hover:border-cyan-500 rounded-2xl p-4 text-center cursor-pointer bg-slate-950/60 transition-all">
                    <input type="file" id="mobileFileInput" accept="image/*" class="hidden" onchange="handleImageSelect(this)">
                    
                    <div id="uploadPlaceholder" class="space-y-1.5 py-2">
                        <div class="w-12 h-12 rounded-full bg-cyan-950 text-cyan-400 border border-cyan-500/30 flex items-center justify-center mx-auto text-xl">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                        </div>
                        <p class="text-xs text-slate-200 font-bold">Tekan di sini untuk memilih foto</p>
                        <p class="text-[10px] text-slate-400">Format JPG, PNG atau WebP (Kamera / Galeri HP)</p>
                    </div>

                    <div id="uploadPreviewContainer" class="hidden relative">
                        <img id="mobilePreviewImg" src="" alt="Preview Upload" class="max-h-52 rounded-xl mx-auto object-cover border border-slate-700 shadow-lg">
                        <button type="button" onclick="event.stopPropagation(); removeSelectedImage();" class="absolute top-2 right-2 bg-rose-600 hover:bg-rose-500 text-white rounded-full w-7 h-7 flex items-center justify-center text-xs shadow-md">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- AI Photo Restyle Button -->
            <button type="button" id="aiRestyleBtn" onclick="restylePhotoAi()" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 py-2.5 rounded-xl flex items-center justify-center gap-2 font-semibold cursor-pointer transition-all">
                <i class="fa-solid fa-palette text-amber-300"></i> Transformasi Foto AI
            </button>

            <!-- Sender Wish Message -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label for="guestWishInput" class="font-semibold text-slate-300">Pesan & Doa Ucapan</label>
                    <button type="button" id="aiWishBtn" onclick="generateAiWish()" class="text-[10px] text-cyan-400 flex items-center gap-1 bg-cyan-950/80 border border-cyan-500/30 px-2.5 py-1 rounded-full font-medium cursor-pointer hover:bg-cyan-900 transition-all">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> AI Magic Wish
                    </button>
                </div>
                <textarea id="guestWishInput" rows="2" placeholder="Tulis ucapan selamat atau kesan pesan Anda..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500 resize-none text-xs"></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="mobileSubmitBtn" class="w-full bg-gradient-to-r from-cyan-500 to-rose-500 hover:from-cyan-400 hover:to-rose-400 text-white font-bold py-3 rounded-xl shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2 cursor-pointer transition-all text-sm">
                <i class="fa-solid fa-paper-plane"></i> Kirim Ke Videotron
            </button>
        </form>

        <!-- Footer Notice -->
        <p class="text-[10px] text-center text-slate-500 pt-2 border-t border-slate-800/80">
            Powered by Simplemice Live Event Photobooth System
        </p>

    </div>

    <div id="toast" class="fixed bottom-6 inset-x-4 max-w-sm mx-auto transform translate-y-24 opacity-0 transition-all duration-300 z-50 bg-slate-900 border border-slate-700 text-white p-4 rounded-2xl shadow-2xl flex items-center space-x-3 pointer-events-none">
        <div id="toastIcon" class="w-9 h-9 rounded-xl bg-cyan-500/20 text-cyan-400 flex items-center justify-center font-bold shrink-0">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <div>
            <p id="toastTitle" class="text-xs font-bold">Notifikasi</p>
            <p id="toastMsg" class="text-[11px] text-slate-300">Pesan tidak terkirim.</p>
        </div>
    </div>

    <script>
        var apiKey = typeof apiKey !== 'undefined' ? apiKey : "";
        let uploadedBase64 = null;
        let eventTitles = { main: 'Gala Dinner', sub: 'BNI Enterprise' };

        window.onload = function () {
            try {
                const savedTitles = localStorage.getItem('simplemice_titles');
                if (savedTitles) {
                    eventTitles = JSON.parse(savedTitles);
                }
            } catch (e) {}

            const mainEl = document.getElementById('eventTitleHeading');
            const subEl = document.getElementById('eventSubtitleHeading');
            if (mainEl) mainEl.innerText = eventTitles.main;
            if (subEl) subEl.innerText = eventTitles.sub;
        };

        function handleImageSelect(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    uploadedBase64 = e.target.result;
                    document.getElementById('mobilePreviewImg').src = uploadedBase64;
                    document.getElementById('uploadPlaceholder').classList.add('hidden');
                    document.getElementById('uploadPreviewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function removeSelectedImage() {
            uploadedBase64 = null;
            document.getElementById('mobileFileInput').value = '';
            document.getElementById('uploadPlaceholder').classList.remove('hidden');
            document.getElementById('uploadPreviewContainer').classList.add('hidden');
        }

        function submitPhotoFromMobile() {
            const name = document.getElementById('guestNameInput').value.trim();
            const wish = document.getElementById('guestWishInput').value.trim();

            if (!name) {
                showToast('Nama Wajib', 'Mohon isi nama atau inisial Anda.', 'error');
                return;
            }
            if (!uploadedBase64) {
                showToast('Foto Wajib', 'Pilih foto sebelum dikirim.', 'error');
                return;
            }

            let photoList = [];
            let autoApprove = true;

            try {
                const savedList = localStorage.getItem('simplemice_photos');
                if (savedList) photoList = JSON.parse(savedList);

                const savedAuto = localStorage.getItem('simplemice_auto_approve');
                if (savedAuto !== null) autoApprove = JSON.parse(savedAuto);
            } catch (e) {}

            const newPhoto = {
                id: 'photo_' + Date.now(),
                sender: name,
                wish: wish || 'Mengirimkan ucapan hangat untuk acara ini!',
                status: autoApprove ? 'approved' : 'pending',
                timestamp: 'Baru Saja',
                url: uploadedBase64
            };

            photoList.unshift(newPhoto);
            
            try {
                localStorage.setItem('simplemice_photos', JSON.stringify(photoList));
                // Fire window storage event for local tab triggers
                window.dispatchEvent(new Event('storage'));
            } catch (e) {
                showToast('Ukuran File Besar', 'Ukuran foto terlalu besar untuk memori lokal.', 'error');
                return;
            }

            // Reset Form State
            removeSelectedImage();
            document.getElementById('guestNameInput').value = '';
            document.getElementById('guestWishInput').value = '';

            showToast('Berhasil Terkirim!', autoApprove ? 'Fotomu langsung ditayangkan di Videotron!' : 'Fotomu sedang disetujui panitia.', 'success');
        }

        async function fetchWithBackoff(url, options, maxRetries = 3) {
            let delay = 1000;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.status === 429) {
                        await new Promise(res => setTimeout(res, delay));
                        delay *= 2;
                        continue;
                    }
                    return response;
                } catch (err) {
                    if (i === maxRetries - 1) throw err;
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }
            }
            throw new Error("Max retry attempts reached.");
        }

        async function generateAiWish() {
            const btn = document.getElementById('aiWishBtn');
            const input = document.getElementById('guestWishInput');
            const sender = document.getElementById('guestNameInput').value.trim() || 'Tamu Undangan';

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Loading...`;

            const prompt = `Buatkan ucapan singkat, manis, dan berkesan untuk acara "${eventTitles.main} - ${eventTitles.sub}" dari pengirim "${sender}". Maksimal 2 kalimat.`;
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            try {
                const res = await fetchWithBackoff(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;

                if (text) {
                    input.value = text.trim();
                    showToast('AI Wish Generated', 'Ucapan manis berhasil dibuat!', 'success');
                }
            } catch (err) {
                input.value = "Selamat untuk acaranya! Semoga sukses, bahagia, dan penuh kebaikan selalu!";
                showToast('AI Wish Ready', 'Menggunakan ucapan rekomendasi.', 'info');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> AI Magic Wish`;
            }
        }

        async function restylePhotoAi() {
            if (!uploadedBase64) {
                showToast('Pilih Foto', 'Unggah foto terlebih dahulu sebelum di-restyle.', 'error');
                return;
            }

            const btn = document.getElementById('aiRestyleBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Transformasi Foto...`;

            const pureBase64 = uploadedBase64.split(',')[1];
            const mimeType = uploadedBase64.split(';')[0].split(':')[1] || 'image/png';

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${apiKey}`;
            
            try {
                const res = await fetchWithBackoff(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            role: "user",
                            parts: [
                                { text: "Restyle this photo into an elegant gala dinner celebration portrait with sparkles while preserving faces." },
                                { inlineData: { mimeType: mimeType, data: pureBase64 } }
                            ]
                        }],
                        generationConfig: { responseModalities: ['TEXT', 'IMAGE'] }
                    })
                });

                const data = await res.json();
                const part = data?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);

                if (part && part.inlineData?.data) {
                    uploadedBase64 = `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
                    document.getElementById('mobilePreviewImg').src = uploadedBase64;
                    showToast('Restyle Berhasil', 'Fotomu berhasil ditransformasi!', 'success');
                }
            } catch (err) {
                showToast('Fitur AI Busy', 'Menggunakan format foto asli.', 'info');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-palette text-amber-300"></i> Transformasi Foto AI`;
            }
        }

        function showToast(title, message, type = 'info') {
            const toast = document.getElementById('toast');
            const tTitle = document.getElementById('toastTitle');
            const tMsg = document.getElementById('toastMsg');

            if (!toast || !tTitle || !tMsg) return;

            tTitle.innerText = title;
            tMsg.innerText = message;

            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 3500);
        }
    </script>
</body>
</html>
