<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simplemice Videotron Fullscreen Display</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600;1,800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        heading: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes floatRandom1 { 0%, 100% { transform: translateY(0px) rotate(-4deg) scale(0.9); } 50% { transform: translateY(-8px) rotate(-2deg) scale(0.93); } }
        @keyframes floatRandom2 { 0%, 100% { transform: translateY(0px) rotate(5deg) scale(0.85); } 50% { transform: translateY(8px) rotate(3deg) scale(0.88); } }
        .anim-float-1 { animation: floatRandom1 7s ease-in-out infinite; }
        .anim-float-2 { animation: floatRandom2 8.5s ease-in-out infinite; }
        .center-glow { box-shadow: 0 0 80px rgba(6, 182, 212, 0.35), 0 0 140px rgba(244, 63, 94, 0.2); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen w-screen overflow-hidden select-none">

    <header class="absolute top-0 inset-x-0 z-40 p-4 md:p-6 flex justify-between items-center bg-gradient-to-b from-slate-950/90 via-slate-950/40 to-transparent pointer-events-auto">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-500 to-rose-500 flex items-center justify-center shadow-lg shadow-cyan-500/30">
                <i class="fa-solid font-bold text-white text-xl fa-camera-retro"></i>
            </div>
            <div>
                <h1 class="text-base md:text-lg font-bold tracking-wider text-white font-heading leading-none">
                    SIMPLEMICE <span class="text-cyan-400 font-normal text-xs px-2 py-0.5 rounded bg-cyan-950/80 border border-cyan-500/30 ml-1">LIVE VIDEOTRON</span>
                </h1>
                <p class="text-xs text-slate-400 mt-1 flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                    <span id="eventTitleDisplay" class="text-slate-200 font-medium">Gala Dinner - BNI Enterprise</span>
                </p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <div class="flex items-center bg-slate-900/90 p-1.5 rounded-xl border border-slate-800 text-xs font-semibold backdrop-blur-md">
                <button type="button" id="btnViewVideotron" onclick="switchMainTab('videotron')" class="px-3.5 py-2 rounded-lg text-cyan-400 bg-slate-800 border border-cyan-500/30 transition-all flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-tv"></i> <span>Tampilan Videotron</span>
                </button>
                <button type="button" id="btnViewAdmin" onclick="switchMainTab('admin')" class="px-3.5 py-2 rounded-lg text-slate-400 hover:text-white transition-all flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-sliders"></i> <span>Dashboard Admin</span>
                </button>
            </div>
        </div>
    </header>

    <main id="viewVideotron" class="relative w-full h-full flex flex-col items-center justify-center p-2 md:p-6 pt-20">
        <div id="leftScatterContainer" class="absolute left-2 md:left-6 top-24 bottom-16 w-1/5 max-w-[180px] flex flex-col justify-around z-20"></div>
        <div id="rightScatterContainer" class="absolute right-2 md:right-6 top-24 bottom-16 w-1/5 max-w-[180px] flex flex-col justify-around z-20"></div>

        <div class="relative z-30 max-w-4xl w-full mx-auto flex flex-col items-center justify-center my-auto px-4">
            <div class="text-center mb-3 space-y-0.5">
                <h1 id="centerMainHeader" class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-rose-300 to-amber-200 font-heading tracking-wider">Gala Dinner</h1>
                <h2 id="centerSubHeader" class="text-sm md:text-lg font-bold text-slate-300 uppercase tracking-[0.25em]">BNI Enterprise</h2>
            </div>

            <div class="relative w-full aspect-[16/10] max-h-[62vh] bg-slate-900 rounded-3xl p-3 border-2 border-slate-700/80 center-glow transition-all shadow-2xl">
                <div class="relative w-full h-full rounded-2xl overflow-hidden bg-slate-950 flex items-center justify-center">
                    <img id="centerFeaturedImg" src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=80" alt="Spotlight Photo" class="w-full h-full object-cover transition-opacity duration-700">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/95 via-slate-950/20 to-transparent"></div>
                    <div class="absolute bottom-0 inset-x-0 p-5 md:p-7 text-left space-y-1.5">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] md:text-xs uppercase font-extrabold tracking-widest text-cyan-400 bg-cyan-950/90 px-3 py-1 rounded-md border border-cyan-500/30">
                                <i class="fa-solid fa-heart text-rose-500 mr-1.5"></i> Live Guest Photo
                            </span>
                            <span id="centerPhotoTime" class="text-[11px] text-slate-400 font-mono">Baru Saja</span>
                        </div>
                        <h3 id="centerFeaturedSender" class="text-2xl md:text-4xl font-extrabold text-white font-heading">Rian & Maya</h3>
                        <p id="centerFeaturedWish" class="text-xs md:text-base text-slate-200 italic line-clamp-2">"Selamat menempuh hidup baru! Semoga bahagia selamanya!"</p>
                    </div>
                </div>
            </div>

            <div class="mt-4 flex items-center justify-between w-full max-w-2xl bg-slate-900/90 border border-slate-800 p-2.5 px-5 rounded-2xl shadow-2xl">
                <div class="flex items-center gap-3">
                    <button type="button" onclick="prevPhoto()" class="w-9 h-9 rounded-xl bg-slate-800 text-slate-200 flex items-center justify-center cursor-pointer"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                    <button type="button" onclick="nextPhoto()" class="w-9 h-9 rounded-xl bg-slate-800 text-slate-200 flex items-center justify-center cursor-pointer"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                    <span class="text-xs text-slate-400 font-mono" id="slideCounter">1 / 1</span>
                </div>
                <a id="qrLinkAnchor" href="upload.html" target="_blank" class="flex items-center gap-2.5">
                    <div class="bg-white p-1 rounded-lg">
                        <img id="qrCodeImg" src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=upload.html" class="w-8 h-8 rounded" alt="QR Upload">
                    </div>
                    <div class="text-left hidden sm:block">
                        <p class="text-[9px] font-bold text-cyan-400 uppercase">Scan QR HP Tamu</p>
                        <p class="text-[11px] font-semibold text-white">Buka upload.html</p>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <section id="viewAdmin" class="hidden relative z-30 w-full h-full max-w-6xl mx-auto p-6 overflow-y-auto pt-24 pb-12">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
            <h2 class="text-lg font-bold font-heading text-white flex items-center gap-2">
                <i class="fa-solid fa-shield-halved text-cyan-400"></i> Panel Moderasi Admin
            </h2>
            <div id="adminPhotoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4"></div>
        </div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Kredensial Firebase Project Live
        const firebaseConfig = {
            apiKey: "AIzaSyARSGnFk3WQ7ZPpInl6DtfnGM5MvJSXsVQ",
            authDomain: "live-photo-7a430.firebaseapp.com",
            projectId: "live-photo-7a430",
            storageBucket: "live-photo-7a430.firebasestorage.app",
            messagingSenderId: "923238404835",
            appId: "1:923238404835:web:b6d500e896a8c69a8f6bd6",
            measurementId: "G-QZ6H30GNFG"
        };

        let photoList = [
            {
                id: 'photo_demo',
                sender: 'Simplemice Team',
                wish: 'Selamat datang di Live Videotron Event! Scan QR Code untuk mengunggah foto Anda secara langsung.',
                status: 'approved',
                timestamp: 'Baru Saja',
                url: 'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80'
            }
        ];

        let activePhotoIndex = 0;

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            const q = query(collection(db, "photos"), orderBy("createdAt", "desc"));
            
            // Realtime Snapshot Listener: Otomatis menerima foto baru saat diunggah dari HP mana pun!
            onSnapshot(q, (snapshot) => {
                const cloudPhotos = [];
                snapshot.forEach((doc) => cloudPhotos.push({ id: doc.id, ...doc.data() }));
                if (cloudPhotos.length > 0) {
                    photoList = cloudPhotos;
                    renderVideotron();
                }
            });
        } catch (e) {
            console.warn("Gagal memuat listener realtime Firebase:", e);
        }

        window.renderVideotron = function() {
            const approved = photoList.filter(p => p.status === 'approved');
            if (approved.length === 0) return;
            if (activePhotoIndex >= approved.length) activePhotoIndex = 0;

            const curr = approved[activePhotoIndex];
            document.getElementById('centerFeaturedImg').src = curr.url;
            document.getElementById('centerFeaturedSender').innerText = curr.sender;
            document.getElementById('centerFeaturedWish').innerText = `"${curr.wish}"`;
            document.getElementById('centerPhotoTime').innerText = curr.timestamp || 'Baru Saja';
            document.getElementById('slideCounter').innerText = `${activePhotoIndex + 1} / ${approved.length}`;
        };

        window.nextPhoto = function() {
            const approved = photoList.filter(p => p.status === 'approved');
            if (approved.length > 0) {
                activePhotoIndex = (activePhotoIndex + 1) % approved.length;
                renderVideotron();
            }
        };

        window.prevPhoto = function() {
            const approved = photoList.filter(p => p.status === 'approved');
            if (approved.length > 0) {
                activePhotoIndex = (activePhotoIndex - 1 + approved.length) % approved.length;
                renderVideotron();
            }
        };

        window.switchMainTab = function(view) {
            document.getElementById('viewVideotron').classList.toggle('hidden', view !== 'videotron');
            document.getElementById('viewAdmin').classList.toggle('hidden', view !== 'admin');
        };

        setInterval(nextPhoto, 5000);
        renderVideotron();
    </script>
</body>
</html>
